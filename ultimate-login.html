<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Desk - Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; padding:24px; }
    .login-shell { width:min(100%, 520px); padding:clamp(28px, 6vw, 54px); border:1px solid var(--line); border-radius:34px; background:linear-gradient(145deg,rgba(18,27,59,.9),rgba(10,15,38,.78)); box-shadow:0 25px 80px rgba(0,0,0,.38); backdrop-filter:blur(20px); }
    .brand { margin:0 0 10px; color:#fff; font:700 clamp(2.5rem,8vw,4.5rem)/1 'Space Grotesk',sans-serif; text-align:center; letter-spacing:-.07em; background:linear-gradient(90deg,#fff,#b9a5ff 48%,#67e8f9); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .tagline { margin:0 0 30px; color:var(--muted); text-align:center; }
    .tabs { display:flex; gap:10px; margin-bottom:26px; }
    .tab-btn { flex:1; padding:12px; border:1px solid var(--line); border-radius:13px; color:var(--muted); background:rgba(255,255,255,.06); font:600 1rem 'DM Sans',sans-serif; cursor:pointer; }
    .tab-btn.active { color:#fff; background:linear-gradient(135deg,var(--primary),#2563eb); }
    .form { display:none; }
    .form.active { display:block; }
    .form-group { margin-bottom:18px; }
    label { display:block; margin-bottom:8px; color:#d8dfff; font-weight:600; }
    input { width:100%; padding:15px 16px; border:1px solid var(--line); border-radius:14px; color:#fff; background:rgba(255,255,255,.06); font:inherit; }
    input::placeholder { color:#7f8bad; }
    input:focus { outline:none; border-color:var(--secondary); box-shadow:0 0 0 4px rgba(34,211,238,.12); }
    .btn { width:100%; padding:15px; border:0; border-radius:14px; color:#fff; background:linear-gradient(135deg,var(--primary),#2563eb); font:700 1rem 'DM Sans',sans-serif; cursor:pointer; box-shadow:0 10px 24px rgba(99,102,241,.3); }
    .btn:hover { transform:translateY(-2px); }
    .status { display:none; margin-top:16px; padding:12px; border-radius:12px; text-align:center; }
    .status.success { display:block; color:#86efac; background:rgba(34,197,94,.12); }
    .status.error { display:block; color:#fda4af; background:rgba(244,63,94,.12); }
    .forgot { display:none; margin-top:18px; text-align:center; }
    .forgot.show { display:block; }
    .forgot a { color:#67e8f9; text-decoration:none; }
  </style>
</head>
<body>
  <main class="login-shell">
    <h1 class="brand">College Desk</h1>
    <p class="tagline">Learn web development in one focused space.</p>
    <div class="tabs">
      <button class="tab-btn active" type="button" onclick="showTab('signup', this)">Sign Up</button>
      <button class="tab-btn" type="button" onclick="showTab('login', this)">Login</button>
    </div>
    <form id="signup-form" class="form active">
      <div class="form-group"><label for="signup-name">Full Name</label><input id="signup-name" type="text" placeholder="Enter your full name" required></div>
      <div class="form-group"><label for="signup-email">Email</label><input id="signup-email" type="email" placeholder="your.email@example.com" required></div>
      <div class="form-group"><label for="signup-password">Password</label><input id="signup-password" type="password" placeholder="Minimum 6 characters" minlength="6" required></div>
      <button class="btn" type="submit">Create Account</button>
    </form>
    <form id="login-form" class="form">
      <div class="form-group"><label for="login-email">Email</label><input id="login-email" type="email" placeholder="your.email@example.com" required></div>
      <div class="form-group"><label for="login-password">Password</label><input id="login-password" type="password" placeholder="Enter your password" required></div>
      <button class="btn" type="submit">Sign In</button>
    </form>
    <div id="status" class="status"></div>
    <div id="forgot-link" class="forgot"><a href="#" onclick="resetPassword(event)">Forgot Password?</a></div>
  </main>
  <script>
    let users = JSON.parse(localStorage.getItem('users')) || [];
    function showStatus(message, type='success') { const el=document.getElementById('status'); el.textContent=message; el.className='status '+type; setTimeout(()=>{el.className='status';el.textContent='';},3500); }
    function showTab(tab, button) { document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); button.classList.add('active'); document.querySelectorAll('.form').forEach(f=>f.classList.remove('active')); document.getElementById(tab+'-form').classList.add('active'); document.getElementById('forgot-link').classList.toggle('show', tab==='login'); }
    function resetPassword(e) { e.preventDefault(); const email=prompt('Enter email to reset password:'); if(!email)return; const user=users.find(u=>u.email===email); if(!user)return showStatus('Email not found','error'); const pwd=prompt('Enter new password (min 6 chars):'); if(pwd&&pwd.length>=6){user.pwd=pwd;localStorage.setItem('users',JSON.stringify(users));showStatus('Password reset!');document.getElementById('login-email').value=email;}else showStatus('Invalid password','error'); }
    document.getElementById('signup-form').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('signup-name').value.trim(),email=document.getElementById('signup-email').value.trim(),pwd=document.getElementById('signup-password').value;if(!name||!email||pwd.length<6)return showStatus('Fill all fields. Password must be 6+ characters.','error');if(users.some(u=>u.email===email))return showStatus('Email exists! Try login.','error');users.push({name,email,pwd});localStorage.setItem('users',JSON.stringify(users));localStorage.setItem('currentUser',email);showStatus('Account created! Redirecting...');setTimeout(()=>location.href='index.html',1000);});
    document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();const email=document.getElementById('login-email').value.trim(),pwd=document.getElementById('login-password').value,user=users.find(u=>u.email===email&&u.pwd===pwd);if(!user)return showStatus('Invalid credentials','error');localStorage.setItem('currentUser',email);showStatus('Welcome! Redirecting...');setTimeout(()=>location.href='index.html',1000);});
    if(localStorage.getItem('currentUser')) location.href='index.html';
  </script>
</body>
</html>
