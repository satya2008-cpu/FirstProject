<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - COLLEGE DESK</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Get In Touch</h1>
        <p>Have questions or suggestions? Send us a message!</p>

        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name" class="form-label">Name:</label>
                <input type="text" id="name" name="name" required class="form-input">
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" name="email" required class="form-input">
            </div>
            <div class="form-group">
                <label for="message" class="form-label">Message:</label>
                <textarea id="message" name="message" rows="5" required class="form-input form-textarea"></textarea>
            </div>
            <button type="submit" class="form-button">
                Send Message
            </button>
        </form>
        <p class="email-info">
            Or email us at: <a href="mailto:info@collegedesk.com" class="email-link">info@collegedesk.com</a>
        </p>

    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your message! (This is a demo - form submits via email/backend in production.)');
            this.reset();
        });
    </script>
    <script src="auth.js"></script>
</body>

</html>
